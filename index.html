<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CEEJA • Teste MindAR • Pong</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
    #top {
      position:fixed; left:12px; right:12px; top:12px; z-index:9999;
      padding:10px 14px; border-radius:14px;
      background:rgba(0,0,0,.72); color:#fff; text-align:center;
      font-size:14px; line-height:1.35;
    }
    #status {
      position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
      z-index:9999; min-width:220px; max-width:88vw;
      padding:11px 16px; border-radius:999px;
      background:rgba(0,0,0,.78); color:#fff; text-align:center;
      font-size:14px; font-weight:700;
    }
    #targetBadge {
      position:fixed; inset:0; z-index:9998; pointer-events:none;
      display:none; align-items:center; justify-content:center;
    }
    #targetBadge > div {
      margin-top:-46vh;
      padding:9px 14px; border-radius:999px;
      background:rgba(22,163,74,.92); color:white; font-size:14px; font-weight:800;
      box-shadow:0 6px 20px rgba(0,0,0,.25);
    }
  </style>

  <script>
    AFRAME.registerComponent('pong-target-events', {
      init: function () {
        const status = document.getElementById('status');
        const badge = document.getElementById('targetBadge');

        this.el.addEventListener('targetFound', () => {
          status.textContent = '✅ PONG RECONHECIDO';
          badge.style.display = 'flex';
          if (navigator.vibrate) navigator.vibrate(60);
        });

        this.el.addEventListener('targetLost', () => {
          status.textContent = '📷 Aponte para a capa do PONG';
          badge.style.display = 'none';
        });
      }
    });

    window.addEventListener('error', (e) => {
      const status = document.getElementById('status');
      if (status) {
        const msg = String(e.message || '');
        if (msg.includes('mind') || msg.includes('fetch')) {
          status.textContent = '⚠️ Verifique se targets.mind está na mesma pasta do index.html';
        }
      }
    });
  </script>
</head>

<body>
  <div id="top">
    <strong>CEEJA • Teste MindAR 01</strong><br>
    Sem marcador preto: a própria capa do Pong é o alvo.
  </div>

  <div id="status">📷 Aponte para a capa do PONG</div>
  <div id="targetBadge"><div>✨ CAPA RECONHECIDA</div></div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="pongCover" src="./pong-capa.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" pong-target-events>
      <!-- Apenas um contorno leve para comprovar que o tracking está ancorado à capa. -->
      <a-plane
        position="0 0 0.02"
        width="1"
        height="1.5"
        material="color: #ffffff; opacity: 0.05; transparent: true;">
      </a-plane>

      <a-entity position="0 0 0.08">
        <a-ring radius-inner="0.17" radius-outer="0.22"
                material="color:#ffffff; opacity:0.92; transparent:true;"
                animation="property: rotation; to: 0 0 360; loop: true; dur: 2600; easing: linear">
        </a-ring>
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
