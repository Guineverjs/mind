<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>CEEJA ScratchBook Multi v0.1</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
    #top{
      position:fixed;left:12px;right:12px;top:12px;z-index:9999;
      padding:10px 14px;border-radius:14px;
      background:rgba(0,0,0,.72);color:#fff;text-align:center;
      font-size:14px;line-height:1.35
    }
    #status{
      position:fixed;left:14px;right:14px;bottom:14px;z-index:9999;
      padding:11px 14px;border-radius:14px;
      background:rgba(9,19,28,.82);color:#fff;text-align:center;
      font-size:14px;font-weight:700;pointer-events:none
    }
    #badge{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      z-index:9998;display:none;padding:14px 20px;border-radius:18px;
      background:rgba(0,0,0,.78);color:#fff;font:bold 18px Arial;
      pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.35)
    }
    #arContainer{
      overflow:hidden;position:absolute;inset:0;width:100%;height:100%;
    }
    .a-enter-vr{display:none!important}
  </style>

  <script>
    AFRAME.registerComponent('multi-target-events',{
      schema:{name:{type:'string'}},
      init:function(){
        const status=document.getElementById('status');
        const badge=document.getElementById('badge');
        const name=this.data.name;

        this.el.addEventListener('targetFound',()=>{
          if(name==='PONG'){
            status.textContent='🎮 PONG reconhecido — targetIndex 0';
            badge.textContent='🎮 PONG RECONHECIDO';
          }else{
            status.textContent='🐱 ADVENTURE reconhecido — targetIndex 1';
            badge.textContent='🐱 ADVENTURE RECONHECIDO';
          }
          badge.style.display='block';
          if(navigator.vibrate) navigator.vibrate(50);
        });

        this.el.addEventListener('targetLost',()=>{
          badge.style.display='none';
          status.textContent='📷 Aponte para uma das duas capas';
        });
      }
    });
  </script>
</head>

<body>
  <div id="top">
    <strong>CEEJA • ScratchBook Multi v0.1</strong><br>
    Teste de duas capas no mesmo arquivo targets.mind
  </div>

  <div id="status">📷 Aponte para a capa do PONG ou ADVENTURE</div>
  <div id="badge"></div>

  <div id="arContainer">
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 5;"
      color-space="sRGB"
      renderer="antialias: false; colorManagement: false"
      vr-mode-ui="enabled:false"
      device-orientation-permission-ui="enabled:false"
      embedded>

      <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

      <!-- ORDEM DO COMPILADOR:
           targetIndex 0 = 01-pong-capa.jpg
           targetIndex 1 = 02-adventure-capa.jpg
      -->

      <a-entity mindar-image-target="targetIndex:0"
                multi-target-events="name:PONG">
        <a-ring position="0 0 0.05"
                radius-inner="0.16" radius-outer="0.21"
                material="color:#ffffff;opacity:.92;transparent:true"
                animation="property:rotation;to:0 0 360;loop:true;dur:2500;easing:linear">
        </a-ring>
      </a-entity>

      <a-entity mindar-image-target="targetIndex:1"
                multi-target-events="name:ADVENTURE">
        <a-box position="0 0 0.08"
               scale=".22 .22 .22"
               material="color:#ffffff;opacity:.92;transparent:true"
               animation="property:rotation;to:360 360 0;loop:true;dur:3000;easing:linear">
        </a-box>
      </a-entity>

    </a-scene>
  </div>
</body>
</html>
